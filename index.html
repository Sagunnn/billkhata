<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="BillKhata: scan bills, track daily expenses and enter cash bills in Nepal's IRD prize coupon draw. Everything stays in your browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>BillKhata · Bills, Expenses & IRD Lucky Draw</title>
  </head>
  <body style="margin:0;background:#f1f5f9">
    <div id="root">
      <!-- App shell shown while the JS loads. React replaces everything in #root, this style included. -->
      <style>
        .bk{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f172a;min-height:100dvh}
        .bk-b{background:#e2e8f0;border-radius:6px;animation:bk 1.4s ease-in-out infinite}
        @keyframes bk{50%{opacity:.55}}
        @media (prefers-reduced-motion:reduce){.bk-b{animation:none}}
        .bk-h{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;height:56px;padding:env(safe-area-inset-top,0px) 16px 0;background:#fff;border-bottom:1px solid #e2e8f0}
        .bk-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em}
        .bk-logo img{width:32px;height:32px}
        .bk-logo i{font-style:normal;color:#b91c1c}
        .bk-s{display:none}
        .bk-m{padding:20px 16px 0}
        .bk-k{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
        .bk-c{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}
        .bk-r{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid #f1f5f9}
        .bk-r:first-child{border-top:0}
        .bk-n{position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid #e2e8f0}
        .bk-f{position:absolute;left:50%;top:-20px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:#b91c1c;box-shadow:0 0 0 4px #fff}
        .bk-msg{margin-top:16px;font-size:13px;color:#64748b}
        @media (min-width:768px){
          .bk-h,.bk-n{display:none}
          .bk-s{display:block;position:fixed;inset:0 auto 0 0;width:240px;box-sizing:border-box;padding:20px 16px;background:#fff;border-right:1px solid #e2e8f0}
          .bk-m{margin-left:240px;padding:32px}
          .bk-k{grid-template-columns:repeat(4,1fr)}
        }
      </style>
      <div class="bk" aria-busy="true">
        <aside class="bk-s">
          <div class="bk-logo"><img src="/favicon.svg" alt="" /><span>Bill<i>Khata</i></span></div>
          <div class="bk-b" style="height:44px;margin-top:24px;background:#fecaca"></div>
          <div class="bk-b" style="height:14px;width:70%;margin-top:28px"></div>
          <div class="bk-b" style="height:14px;width:60%;margin-top:22px"></div>
          <div class="bk-b" style="height:14px;width:65%;margin-top:22px"></div>
        </aside>
        <header class="bk-h"><div class="bk-logo"><img src="/favicon.svg" alt="" /><span>Bill<i>Khata</i></span></div><div class="bk-b" style="width:110px;height:24px;border-radius:99px"></div></header>
        <main class="bk-m">
          <div class="bk-b" style="height:14px;width:160px"></div>
          <div class="bk-b" style="height:26px;width:200px;margin-top:10px"></div>
          <div class="bk-k">
            <div class="bk-c"><div class="bk-b" style="height:11px;width:70%"></div><div class="bk-b" style="height:26px;width:80%;margin-top:12px"></div></div>
            <div class="bk-c"><div class="bk-b" style="height:11px;width:70%"></div><div class="bk-b" style="height:26px;width:80%;margin-top:12px"></div></div>
            <div class="bk-c"><div class="bk-b" style="height:11px;width:70%"></div><div class="bk-b" style="height:26px;width:60%;margin-top:12px"></div></div>
            <div class="bk-c"><div class="bk-b" style="height:11px;width:70%"></div><div class="bk-b" style="height:26px;width:60%;margin-top:12px"></div></div>
          </div>
          <div class="bk-c" style="margin-top:20px;padding:0">
            <div class="bk-r"><div class="bk-b" style="width:44px;height:44px"></div><div style="flex:1"><div class="bk-b" style="height:14px;width:55%"></div><div class="bk-b" style="height:11px;width:80%;margin-top:8px"></div></div></div>
            <div class="bk-r"><div class="bk-b" style="width:44px;height:44px"></div><div style="flex:1"><div class="bk-b" style="height:14px;width:45%"></div><div class="bk-b" style="height:11px;width:70%;margin-top:8px"></div></div></div>
            <div class="bk-r"><div class="bk-b" style="width:44px;height:44px"></div><div style="flex:1"><div class="bk-b" style="height:14px;width:50%"></div><div class="bk-b" style="height:11px;width:75%;margin-top:8px"></div></div></div>
          </div>
          <p class="bk-msg">Opening BillKhata… your bills load from this device.</p>
          <noscript><p class="bk-msg">BillKhata needs JavaScript turned on.</p></noscript>
        </main>
        <nav class="bk-n"><div class="bk-f"></div></nav>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
