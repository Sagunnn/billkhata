<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e9" />
    <script>
      // iPhone and iPad zoom the page in when a text box under 16 px is tapped, and a home-screen app
      // stays zoomed (the page then slides sideways). maximum-scale stops that zoom; iOS still lets
      // people pinch to zoom. Android keeps the plain viewport, where it would block pinch zoom.
      (function () {
        var ua = navigator.userAgent;
        if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
          document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
        }
      })();
      // Light or dark before the first paint (the app's Settings → Appearance; 'system' follows the phone).
      (function () {
        var c = 'system';
        try { c = localStorage.getItem('billkhata_theme') || 'system'; } catch (e) {}
        var dark = c === 'dark' || (c === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta name="description" content="BillKhata: scan bills, track daily expenses and enter cash bills in Nepal's IRD prize coupon draw. Everything stays in your browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BillKhata" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>BillKhata · Bills, Expenses & IRD Lucky Draw</title>
  </head>
  <body style="margin:0">
    <div id="root">
      <!-- App shell shown while the JS loads. React replaces everything in #root, this style included. -->
      <style>
        .bk{--c:#fffdf9;--l:#e5ddcf;--b:#eee7db;--i:#1c1915;--m:#867e72;--h:#1c1915;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--i);min-height:100dvh}
        [data-theme=dark] .bk{--c:#1d1a16;--l:#302b24;--b:#27231d;--i:#f2ece2;--m:#8a8173;--h:#221f1d}
        .bk-b{background:var(--b);border-radius:8px;animation:bk 1.4s ease-in-out infinite}
        @keyframes bk{50%{opacity:.55}}
        @media (prefers-reduced-motion:reduce){.bk-b{animation:none}}
        .bk-h{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;height:60px;padding:env(safe-area-inset-top,0px) 16px 0}
        .bk-logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
        .bk-logo span{width:36px;height:36px;border-radius:11px;background:#b91c1c;color:#fff;display:grid;place-items:center;font-size:22px}
        .bk-logo i{font-style:normal;color:#b91c1c}
        .bk-s{display:none}
        .bk-m{padding:12px 16px 0}
        .bk-hero{height:260px;border-radius:24px;background:var(--h);margin-top:18px}
        .bk-k{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
        .bk-c{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px}
        .bk-n{position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));background:var(--c);border-top:1px solid var(--l)}
        .bk-f{position:absolute;left:50%;top:-22px;width:60px;height:60px;margin-left:-30px;border-radius:50%;background:#b91c1c;box-shadow:0 0 0 5px var(--c)}
        .bk-msg{margin-top:16px;font-size:13px;color:var(--m)}
        @media (min-width:768px){
          .bk-h,.bk-n{display:none}
          .bk-s{display:block;position:fixed;inset:0 auto 0 0;width:248px;box-sizing:border-box;padding:20px 16px;background:var(--c);border-right:1px solid var(--l)}
          .bk-m{margin-left:248px;padding:32px}
          .bk-k{grid-template-columns:repeat(4,1fr)}
        }
      </style>
      <div class="bk" aria-busy="true">
        <aside class="bk-s">
          <div class="bk-logo"><span>ख</span>Bill<i>Khata</i></div>
          <div class="bk-b" style="height:52px;margin-top:24px;background:#b91c1c;opacity:.85"></div>
          <div class="bk-b" style="height:14px;width:70%;margin-top:28px"></div>
          <div class="bk-b" style="height:14px;width:60%;margin-top:22px"></div>
          <div class="bk-b" style="height:14px;width:65%;margin-top:22px"></div>
        </aside>
        <header class="bk-h"><div class="bk-logo"><span>ख</span>Bill<i>Khata</i></div><div class="bk-b" style="width:110px;height:24px;border-radius:99px"></div></header>
        <main class="bk-m">
          <div class="bk-b" style="height:28px;width:200px;margin-top:8px"></div>
          <div class="bk-b" style="height:14px;width:220px;margin-top:10px"></div>
          <div class="bk-hero"></div>
          <div class="bk-k">
            <div class="bk-c"><div class="bk-b" style="height:11px;width:60%"></div><div class="bk-b" style="height:24px;width:80%;margin-top:12px"></div></div>
            <div class="bk-c"><div class="bk-b" style="height:11px;width:60%"></div><div class="bk-b" style="height:24px;width:70%;margin-top:12px"></div></div>
          </div>
          <p class="bk-msg">Opening BillKhata… your bills load from this device.</p>
          <noscript><p class="bk-msg">BillKhata needs JavaScript turned on.</p></noscript>
        </main>
        <nav class="bk-n"><div class="bk-f"></div></nav>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
